<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="odefiTitle odefiDesc">
  <title id="odefiTitle">ODeFi™ — OneGodian Digital Finance</title>
  <desc id="odefiDesc">ODeFi Luxury Finance Emblem with gold orbiting rings, purple radiant core, and Finance Without Borders banner.</desc>
  <defs>
    <!-- Deep Navy / Carbon Background Radial -->
    <radialGradient id="bgGlow" cx="24%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a0845" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#0b1329" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#ECC665"/>
      <stop offset="50%" stop-color="#C69224"/>
      <stop offset="75%" stop-color="#ECC665"/>
      <stop offset="100%" stop-color="#8C5C08"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE0"/>
      <stop offset="50%" stop-color="#DFB347"/>
      <stop offset="100%" stop-color="#9E6E12"/>
    </linearGradient>

    <!-- Purple Radiant Core -->
    <radialGradient id="purpleCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3DF5" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#A828F7" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#5512A8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2B054D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orbitPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="luxuryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="380" rx="16" fill="url(#bgGlow)"/>

  <!-- Left Emblem Group (X center ~ 210, Y center ~ 190) -->
  <g id="Emblem" transform="translate(190, 190)">
    <!-- Radiant Purple Energy Core behind pillar -->
    <circle cx="0" cy="0" r="100" fill="url(#purpleCore)" opacity="0.85" filter="url(#luxuryGlow)"/>

    <!-- Tilted Elliptical Orbit Rings -->
    <g transform="rotate(-28)">
      <ellipse cx="0" cy="0" rx="155" ry="46" fill="none" stroke="url(#orbitPurple)" stroke-width="4.5" opacity="0.9"/>
      <!-- Orbit Spheres / Nodes -->
      <circle cx="-155" cy="0" r="10" fill="url(#goldLuxury)" filter="url(#drop)"/>
      <circle cx="155" cy="0" r="8" fill="url(#goldLuxury)" filter="url(#drop)"/>
      <circle cx="-155" cy="0" r="4" fill="#FFE58F"/>
      <circle cx="155" cy="0" r="3" fill="#FFE58F"/>
    </g>

    <!-- Outer Beveled Gold Torus / Ring -->
    <circle cx="0" cy="0" r="92" fill="none" stroke="url(#goldLuxury)" stroke-width="26" filter="url(#drop)"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#FFF7C2" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="79" fill="none" stroke="#7A4C03" stroke-width="3" opacity="0.8"/>

    <!-- Central Roman Numeral II / Sacred Double-Pillar Crest -->
    <g filter="url(#drop)">
      <!-- Left Pillar -->
      <path d="M-28 -70 L-10 -70 L-10 70 L-28 70 L-36 0 Z" fill="url(#goldLight)"/>
      <path d="M-28 -70 L-10 -70 L-18 -82 L-36 -70 Z" fill="#FFE58F"/>
      <!-- Right Pillar -->
      <path d="M10 -70 L28 -70 L36 0 L28 70 L10 70 Z" fill="url(#goldLight)"/>
      <path d="M10 -70 L28 -70 L36 -70 L18 -82 Z" fill="#FFE58F"/>
      <!-- Inner purple light gap slit -->
      <line x1="0" y1="-85" x2="0" y2="85" stroke="#E879F9" stroke-width="3" opacity="0.8" filter="url(#luxuryGlow)"/>
    </g>

    <!-- Top North Star / Celestial Diamond -->
    <g transform="translate(0, -96) scale(1.15)" filter="url(#luxuryGlow)">
      <polygon points="0,-24 5,-6 23,0 5,6 0,24 -5,6 -23,0 -5,-6" fill="url(#goldLight)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Brand Typography: ODeFi (X ~ 430, Y ~ 205) -->
  <g id="Typography" filter="url(#drop)">
    <text x="440" y="222" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="140" font-weight="800" letter-spacing="4" fill="url(#goldLuxury)">
      ODeFi
    </text>

    <!-- Gem dot on 'i' in ODeFi: glowing purple orb -->
    <circle cx="952" cy="116" r="16" fill="url(#purpleCore)" filter="url(#luxuryGlow)"/>
    <circle cx="952" cy="116" r="12" fill="url(#orbitPurple)"/>
    <circle cx="950" cy="113" r="4" fill="#FFFFFF"/>

    <!-- Horizontal Gold Accent Rule Lines -->
    <line x1="440" y1="268" x2="520" y2="268" stroke="url(#goldLuxury)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Subtitle: FINANCE WITHOUT BORDERS -->
    <text x="540" y="274" font-family="'Cinzel', 'Montserrat', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="11" fill="url(#goldLight)">
      FINANCE WITHOUT BORDERS
    </text>
    
    <line x1="1080" y1="268" x2="1160" y2="268" stroke="url(#goldLuxury)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
